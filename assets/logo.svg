  <!-- Das "A" (AI) -->
  <path d="M 60 140 L 100 60 L 140 140" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Querbalken des "A" -->
  <line x1="75" y1="110" x2="125" y2="110" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
  
  <!-- KI-Knotenpunkte -->
  <circle cx="100" cy="60" r="10" fill="#ffffff" />
  <circle cx="60" cy="140" r="10" fill="#ffffff" />
  <circle cx="140" cy="140" r="10" fill="#ffffff" />
